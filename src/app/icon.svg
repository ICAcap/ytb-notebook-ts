<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 120 129">
  <defs>
    <!-- Book cover gradient -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5b93cc"/>
      <stop offset="100%" stop-color="#1c3f75"/>
    </linearGradient>

    <!-- Spine gradient -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f0752e"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Brass metal ring gradient -->
    <radialGradient id="ringMetal" cx="35%" cy="28%" r="70%">
      <stop offset="0%"   stop-color="#f0d78a"/>
      <stop offset="100%" stop-color="#8a6a2a"/>
    </radialGradient>

    <!-- Play button gradient -->
    <radialGradient id="playRed" cx="38%" cy="32%" r="72%">
      <stop offset="0%"   stop-color="#ff8952"/>
      <stop offset="100%" stop-color="#b3390f"/>
    </radialGradient>

    <!-- Golden lettering gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <!-- ── BOOK DEPTH / THICKNESS ──────────────────────────── -->
  <rect x="11" y="90" width="67" height="6" rx="2" fill="#152f5c"/>
  <rect x="76" y="7" width="4" height="80" rx="1.5" fill="#e8e2d0"/>

  <!-- ── NOTEBOOK COVER ──────────────────────────────────── -->
  <rect x="8" y="5" width="70" height="87" rx="6" fill="url(#coverGrad)"/>

  <!-- ── BINDING SPINE ────────────────────────────────────── -->
  <rect x="8" y="5" width="21" height="87" rx="6" fill="url(#spineGrad)"/>
  <rect x="22" y="5" width="7" height="87" fill="#9a3412"/>
  <line x1="29" y1="5" x2="29" y2="92" stroke="#152f5c" stroke-width="1.5" opacity="0.4"/>

  <!-- ── PEN THREADED THROUGH THE SPIRAL BINDING ──────────── -->
  <g>
    <rect x="14.5" y="-6" width="5" height="108" rx="2.5" fill="#3a5f95"/>
    <rect x="12.4" y="-5" width="2.1" height="15" rx="1" fill="url(#ringMetal)"/>
    <rect x="14" y="1" width="6" height="4.5" rx="1.3" fill="url(#ringMetal)"/>
    <polygon points="14.5,92 19.5,92 17,104" fill="url(#ringMetal)"/>
    <circle cx="17" cy="103" r="1" fill="#2b2b2b"/>
  </g>

  <!-- ── METAL SPIRAL RINGS ────────────────────────────────── -->
  <ellipse cx="17" cy="18" rx="5.5" ry="4.2" fill="url(#ringMetal)" stroke="#1f2937" stroke-width="0.6"/>
  <ellipse cx="17" cy="32" rx="5.5" ry="4.2" fill="url(#ringMetal)" stroke="#1f2937" stroke-width="0.6"/>
  <ellipse cx="17" cy="46" rx="5.5" ry="4.2" fill="url(#ringMetal)" stroke="#1f2937" stroke-width="0.6"/>
  <ellipse cx="17" cy="60" rx="5.5" ry="4.2" fill="url(#ringMetal)" stroke="#1f2937" stroke-width="0.6"/>
  <ellipse cx="17" cy="74" rx="5.5" ry="4.2" fill="url(#ringMetal)" stroke="#1f2937" stroke-width="0.6"/>

  <!-- ── RULED LINES ───────────────────────────────────────── -->
  <line x1="33" y1="61" x2="72" y2="61" stroke="#f59e0b" stroke-width="1" opacity="0.7" stroke-linecap="round"/>
  <line x1="33" y1="68" x2="72" y2="68" stroke="#f59e0b" stroke-width="1" opacity="0.7" stroke-linecap="round"/>
  <line x1="33" y1="75" x2="63" y2="75" stroke="#f59e0b" stroke-width="1" opacity="0.7" stroke-linecap="round"/>

  <!-- ── YTB TEXT ─────────────────────────────────────────── -->
  <text x="47" y="52.5"
        text-anchor="middle"
        font-family="'VAG Rounded', 'Century Gothic', 'Futura', 'Avant Garde', 'Trebuchet MS', sans-serif"
        font-size="50" font-weight="700" font-style="italic"
        fill="url(#goldText)" letter-spacing="10">YTB</text>

  <!-- ── PLAY BUTTON BADGE ───────────────────────────────── -->
  <circle cx="73" cy="83" r="24" fill="url(#ringMetal)"/>
  <circle cx="73" cy="83" r="22" fill="url(#playRed)"/>
  <polygon points="67,73 67,93 85,83" fill="white"/>
</svg>
